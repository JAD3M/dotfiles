[accessibility]
ui_scale = 1.20

[bar.default]
start  = [ "custom_button", "workspaces", "group:g1" ]
center = [ "weather", "clock" ]
end    = [ "media", "spacer_1", "tray", "notifications", "network", "volume", "battery", "session" ]
thickness = 35
content_scale = 0.75
font_scale = 0.75
margin_edge = 10
margin_ends = 220
concave_edge_corners = false
radius_top_left = 12
radius_top_right = 12
radius_bottom_left = 12
radius_bottom_right = 12
background_opacity = 1.0
padding = 12
widget_spacing = 12
capsule_fill = "surface_container"
capsule_opacity = 1.0

    [[bar.default.capsule_group]]
    id = "g1"
    members = [ "sysmon_cpu", "temp", "sysmon_gpu", "sysmon_2", "sysmon_3" ]
    fill = "surface_variant"
    border = ""
    opacity = 1.0
    padding = 6.0

[theme]
mode = "dark"
source = "community"
community_palette = "Everforest"

    [theme.templates]
    enable_builtin_templates = true
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[weather]
enabled = true

[system.monitor]
gpu_poll_seconds = 2

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    open_near_click_control_center = false
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[widget.custom_button]
type = "custom_button"
glyph = "brand-archlinux-filled"

    [widget.custom_button.actions]
    left = "panel-toggle launcher"

[widget.workspaces]
capsule = true
capsule_fill = "surface"
active_pill_size = 2.5
inactive_pill_size = 1.0
pill_scale = 0.75
show_labels = false

[widget.sysmon_cpu]
type = "sysmon"
scale = 0.7
stat = "cpu_usage"
glyph = "cpu-2"
show_value = true
show_glyph = true

[widget.sysmon_gpu]
type = "sysmon"
scale = 0.7
stat = "gpu_usage"
glyph = "gpu-usage"
show_value = true
show_glyph = true

[widget.temp]
type = "sysmon"
scale = 0.7
stat = "cpu_temp"
glyph = "temperature"
show_value = true
show_glyph = true

[widget.sysmon_2]
type = "sysmon"
scale = 0.7
stat = "gpu_temp"
glyph = "temperature"
show_value = true
show_glyph = true

[widget.ram]
scale = 0.7

[widget.sysmon_3]
type = "sysmon"
stat = "ram_pct"
glyph = "chart-bar"
show_value = true
show_glyph = true

[widget.clock]
anchor = true
color = "secondary"
format = "{:%I:%M %p %A %d/%m/%y}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.tray]
capsule = true
capsule_fill = "surface_container"

[widget.volume]
color = "secondary"

[widget.spacer_1]
type = "spacer"

[plugin_settings."noctalia/notes"]
notes_dir = "~/Documentos/Notes"

[plugin_settings."noctalia/screen_recorder"]
directory = "~/Vídeos/Recordings"

[plugin_settings."yugaaank/better-clock"]
time_format = "{:%I:%M %p}"

[plugin_settings."noctalia/mpvpaper"]
video_directory = "~/Vídeos/Wallpapers"
