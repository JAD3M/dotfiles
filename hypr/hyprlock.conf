# BACKGROUND
background {
    monitor =
    path = /home/yhael/Pictures/Wallpapers/jordan-cormack-jR-HBCMuamc-unsplash.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8
    brightness = 0.6
    vibrancy = 0.1696
    vibrancy_darkness = 0.15
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    fade_on_empty = false
    font_family = SF Pro Display Bold
    hide_input = false
    position = 0, -225
    halign = center
    valign = center
    outer_color = rgba(167, 192, 128, 0.8)
    inner_color = rgba(61, 72, 77, 0.75)
    font_color = rgba(211, 198, 170, 1.0)
    check_color = rgba(219, 188, 127, 0.9)
    fail_color = rgba(230, 126, 128, 0.85)
    placeholder_text = <i><span foreground="##9da9a0">Enter Pass</span></i>
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%-I:%M %p")</span>"
    color = rgba(211, 198, 170, 0.85)
    font_size = 130
    font_family = SF Pro Display Bold
    position = 0, 240
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(LC_TIME=es_MX.UTF-8 date +"%A, %d de %B" | sed 's/^./\U&/')"
    color = rgba(211, 198, 170, 0.85)
    font_size = 30
    font_family = SF Pro Display Bold
    position = 0, 105
    halign = center
    valign = center
}

# Profie-Photo
image {
    monitor =
    path = /home/yhael/Imágenes/fotoPerfil.jpg
    border_color = rgba(167, 192, 128, 0.9)
    border_size = 3
    size = 120
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, -20
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = Hola, $USER
    color = rgba(211, 198, 170, 0.85)
    font_size = 25
    font_family = SF Pro Display Bold
    position = 0, -130
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/Scripts/songdetail.sh)" 
    color = rgba(167, 192, 128, 0.85)
    font_size = 18
    font_family = JetBrains Mono Nerd, SF Pro Display Bold
    position = 0, 60
    halign = center
    valign = bottom
}
